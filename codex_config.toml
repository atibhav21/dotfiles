model = "gpt-5.6-sol"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "xhigh"

approval_policy = "never"
# Do not add sandbox_mode or [sandbox_workspace_write]; either setting disables
# permission profiles and makes protected workspace paths such as .git read-only.
default_permissions = "repo-git"

[permissions.repo-git.filesystem]
"/workspaces/obsidian/.git" = "write"

[permissions.repo-git]
extends = ":workspace"

[permissions.repo-git.workspace_roots]
"/home/vscode" = true

[permissions.repo-git.filesystem.":workspace_roots"]
".git" = "write"

[permissions.repo-git.network]
enabled = true

[projects."/workspaces/obsidian"]
trust_level = "trusted"

[plugins."github@openai-curated"]
enabled = true
